<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Web Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f4f4f4;
    }

    #topBar {
      background-color: #fff;
      padding: 10px;
      border-bottom: 1px solid #ccc;
      transition: all 0.3s ease;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
      font-size: 24px;
    }

    #inputContainer {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    button {
      padding: 10px 14px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #bookmarkBtn {
      background-color: #ffc107;
    }

    #toggleButton {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      opacity: 0.9;
    }

    #bookmarks {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bookmark {
      background: #e0e0e0;
      color: #333;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bookmark span {
      cursor: pointer;
      text-decoration: underline;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: red;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    iframe {
      flex-grow: 1;
      width: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <button id="toggleButton">Hide</button>

  <div id="topBar">
    <h1>Simple Web Browser</h1>

    <div id="inputContainer">
      <input type="text" id="urlInput" placeholder="Enter URL and press Enter..." />
      <button id="bookmarkBtn">⭐ Bookmark</button>
    </div>

    <div id="bookmarks"></div>
  </div>

  <iframe id="browserFrame"></iframe>

  <script>
    const urlInput = document.getElementById("urlInput");
    const browserFrame = document.getElementById("browserFrame");
    const toggleButton = document.getElementById("toggleButton");
    const topBar = document.getElementById("topBar");
    const bookmarkBtn = document.getElementById("bookmarkBtn");
    const bookmarksContainer = document.getElementById("bookmarks");

    let hideTimeout;

    urlInput.addEventListener("keypress", function (event) {
      if (event.key === "Enter") {
        loadURL(urlInput.value);
      }
    });

    toggleButton.addEventListener("click", () => {
      if (topBar.style.display === "none") {
        topBar.style.display = "block";
        toggleButton.textContent = "Hide";
        resetAutoHide();
      } else {
        topBar.style.display = "none";
        toggleButton.textContent = "Show";
        clearTimeout(hideTimeout);
      }
    });

    function loadURL(url) {
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "http://" + url;
      }
      urlInput.value = url;
      browserFrame.src = url;
    }

    function resetAutoHide() {
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        if (topBar.style.display !== "none") {
          topBar.style.display = "none";
          toggleButton.textContent = "Show";
        }
      }, 5000);
    }

    ["mousemove", "keydown", "click", "touchstart"].forEach(evt => {
      document.addEventListener(evt, () => {
        if (topBar.style.display !== "none") {
          resetAutoHide();
        }
      });
    });

    topBar.addEventListener("mouseenter", () => clearTimeout(hideTimeout));
    topBar.addEventListener("mouseleave", () => resetAutoHide());

    resetAutoHide();

    function saveBookmark(url) {
      const bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
      if (!bookmarks.includes(url)) {
        bookmarks.push(url);
        localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
        renderBookmarks();
      }
    }

    function deleteBookmark(url) {
      let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
      bookmarks = bookmarks.filter(b => b !== url);
      localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
      renderBookmarks();
    }

    function renderBookmarks() {
      bookmarksContainer.innerHTML = "";
      const bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");
      bookmarks.forEach(url => {
        const b = document.createElement("div");
        b.className = "bookmark";

        const link = document.createElement("span");
        link.textContent = url;
        link.addEventListener("click", () => loadURL(url));

        const del = document.createElement("button");
        del.textContent = "❌";
        del.className = "delete-btn";
        del.addEventListener("click", () => deleteBookmark(url));

        b.appendChild(link);
        b.appendChild(del);
        bookmarksContainer.appendChild(b);
      });
    }

    bookmarkBtn.addEventListener("click", () => {
      if (urlInput.value.trim()) {
        saveBookmark(urlInput.value.trim());
      }
    });

    renderBookmarks();
  </script>
</body>
</html>
